<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="16.css">
</head>
<body>

<div class="container">

    <div class="team">
        <h1>Team1</h1>
        <div class="score" id="home-score">0</div>

        <div class="buttons">
            <button onclick="addHome(1)">+1</button>
            <button onclick="addHome(2)">+2</button>
            <button onclick="addHome(3)">+3</button>
        </div>
    </div>

    <div class="team">
        <h1>Team2</h1>
        <div class="score" id="guest-score">0</div>

        <div class="buttons">
            <button onclick="addGuest(1)">+1</button>
            <button onclick="addGuest(2)">+2</button>
            <button onclick="addGuest(3)">+3</button>
        </div>
    </div>

</div>

<script src="16.js"></script>
</body>
</html>
